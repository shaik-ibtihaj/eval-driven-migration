[project]
name = "eval-driven-migration"
version = "0.1.0"
description = "Legacy Flask benchmark foundation for an evaluation-driven migration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1.0,<4",
    "flask-sqlalchemy>=3.1.1,<4",
    "gunicorn>=23.0.0,<24",
    "psycopg[binary]>=3.2.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "ruff>=0.11.0,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["apps/legacy/src"]
testpaths = ["apps/legacy/tests"]
markers = [
    "postgres: requires a live PostgreSQL database",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/legacy/src", "apps/legacy/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
